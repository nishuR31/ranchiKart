name: Frontend Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'frontend/**'

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  frontend-build-and-automerge:
    name: Frontend Build & Auto-Merge
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend (Check Errors & Conflicts)
        run: bun run build

      - name: Auto-Merge Pull Request if Build Passes
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Frontend build succeeded with 0 errors. Merging PR into main branch..."
          gh pr merge "$PR_URL" --merge --delete-branch || gh pr merge "$PR_URL" --merge --auto
